name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo package --locked

  lifecycle-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - name: Install pinned coverage tool
        uses: taiki-e/install-action@13608cbb45b01feb47ef444ab1a42dc41ad56f1a # v2.79.11
        with:
          tool: cargo-llvm-cov
          fallback: none
      - name: Require 100% line coverage for pure Local lifecycle modules
        run: |
          cargo llvm-cov --all-features --locked --json --output-path coverage.json
          for file in \
            src/space/graph.rs \
            src/space/host.rs \
            src/space/release.rs \
            src/space/status.rs \
            src/space/storage/evidence.rs
          do
            covered="$(jq --arg suffix "$file" \
              '[.data[0].files[] | select(.filename | endswith($suffix)) | select(.summary.lines.percent == 100)] | length' \
              coverage.json)"
            test "$covered" = 1 || {
              echo "::error::$file does not have exact 100% line coverage"
              exit 1
            }
          done

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test
        shell: bash
        run: |
          processors="$(getconf _NPROCESSORS_ONLN 2>/dev/null || nproc)"
          cargo test --all-features --locked --jobs "${processors}"
      - name: Smoke test without Docker or repository artifacts
        shell: bash
        env:
          SHIMPZ_CACHE_DIR: ${{ runner.temp }}/shimpz
        run: |
          cargo build --locked
          bin="target/debug/shimpz"
          test "${RUNNER_OS}" = "Windows" && bin="${bin}.exe"
          "${bin}" assistant check --project tests/fixtures/assistant
          test "$("${bin}" assistant run greet --project tests/fixtures/assistant --input '{"name":"Ada"}')" = '{"message":"Hello, Ada"}'
          # The CLI makes every provider call itself and the Action never holds a credential (ADR-0106). Both calls
          # below are refused before anything is sent, so the smoke stays offline.
          export SHIMPZ_INTEGRATION_CLOUDFLARE=test-token
          test "$("${bin}" assistant run report --project tests/fixtures/assistant --input '{"url":"https://example.org/"}')" = '{"outcome":"refused"}'
          test "$(env -u SHIMPZ_INTEGRATION_CLOUDFLARE "${bin}" assistant run report --project tests/fixtures/assistant --input '{"url":"https://api.cloudflare.com/client/v4/zones"}')" = '{"outcome":"credential-missing"}'
          test "$(find tests/fixtures/assistant -type f | wc -l)" -eq 5
