name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${tag_version}" = "${package_version}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-features --locked --jobs "$(nproc)"
      - run: cargo package --locked
      - name: Check crates.io
        id: registry
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output crate-index \
            "https://index.crates.io/sh/im/shimpz-cli"
          if jq --exit-status --arg version "${{ steps.version.outputs.version }}" \
            'select(.vers == $version and .yanked == false)' crate-index > /dev/null
          then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: shimpz
            format: tar
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            executable: shimpz
            format: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: shimpz
            format: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: shimpz
            format: tar
          - runner: macos-latest
            target: aarch64-apple-darwin
            executable: shimpz
            format: tar
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: shimpz.exe
            format: zip
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install musl linker
        if: ${{ contains(matrix.platform.target, 'musl') }}
        timeout-minutes: 13
        shell: bash
        run: |
          set -euo pipefail
          apt_options=(
            -o Acquire::Retries=2
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Dpkg::Lock::Timeout=60
          )
          installed=0
          for attempt in 1 2 3; do
            if (( attempt > 1 )); then
              echo "Repairing interrupted package state before attempt ${attempt}." >&2
              sudo timeout --kill-after=10s 60s dpkg --configure -a || true
              sleep 5
            fi
            if ! sudo timeout --kill-after=10s 60s apt-get "${apt_options[@]}" update; then
              echo "Package index attempt ${attempt} failed." >&2
              continue
            fi
            if sudo timeout --kill-after=10s 120s apt-get "${apt_options[@]}" install -y \
              --no-install-recommends musl-tools
            then
              installed=1
              break
            fi
            echo "Package installation attempt ${attempt} failed." >&2
          done
          if (( installed != 1 )); then
            echo "::error::the musl linker could not be installed"
            exit 1
          fi
          command -v musl-gcc >/dev/null || {
            echo "::error::required workflow tool is missing: musl-gcc"
            exit 1
          }
      - run: rustup target add ${{ matrix.platform.target }}
      - run: cargo build --release --locked --target ${{ matrix.platform.target }}
      - name: Verify binary
        shell: bash
        run: target/${{ matrix.platform.target }}/release/${{ matrix.platform.executable }} --version
      - name: Package binary
        shell: bash
        run: |
          name="shimpz-${{ needs.metadata.outputs.version }}-${{ matrix.platform.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.executable }}" "dist/${name}/"
          cp LICENSE NOTICE README.md "dist/${name}/"
          if test "${{ matrix.platform.format }}" = "zip"; then
            7z a "dist/${name}.zip" "./dist/${name}/*"
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.platform.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [metadata, build]
    if: needs.metadata.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Authenticate to crates.io
        id: crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish shimpz-cli
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}

  registry-satisfied:
    needs: [metadata, build, publish]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Verify the exact unyanked crate is public
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 2 \
              --output crate-index \
              "https://index.crates.io/sh/im/shimpz-cli" && \
              jq --exit-status --arg version "${VERSION}" \
                'select(.vers == $version and .yanked == false)' crate-index > /dev/null
            then
              exit 0
            fi
            echo "Waiting for shimpz-cli ${VERSION} to become visible on crates.io (${attempt}/30)."
            sleep 10
          done
          echo "::error::shimpz-cli ${VERSION} is not available as an unyanked crates.io release"
          exit 1

  release:
    needs: [metadata, build, registry-satisfied]
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          cd dist
          expected=(
            "shimpz-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "shimpz-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            "shimpz-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "shimpz-${VERSION}-x86_64-apple-darwin.tar.gz"
            "shimpz-${VERSION}-aarch64-apple-darwin.tar.gz"
            "shimpz-${VERSION}-x86_64-pc-windows-msvc.zip"
          )
          mapfile -t actual < <(find . -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t required < <(printf '%s\n' "${expected[@]}" | sort)
          if ! diff -u <(printf '%s\n' "${required[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "::error::the release must contain exactly six target archives"
            exit 1
          fi
          sha256sum "${expected[@]}" > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
      - name: Attest every released binary archive
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/shimpz-*
      - name: Verify every local archive attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for archive in dist/shimpz-*; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
          done
      - name: Create draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          if jq --exit-status --arg tag "${GITHUB_REF_NAME}" \
            'any(.[]; .tag_name == $tag)' releases.json > /dev/null
          then
            echo "::error::a GitHub release already exists for ${GITHUB_REF_NAME}; inspect it manually"
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --draft \
            --title "Shimpz CLI ${{ needs.metadata.outputs.version }}"

  verify-draft:
    needs: [metadata, release]
    runs-on: ubuntu-latest
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Download and verify the exact draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          gh api "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" > releases.json
          jq --exit-status --arg tag "${TAG}" \
            '[.[] | select(.tag_name == $tag and .draft == true)] | length == 1' \
            releases.json > /dev/null
          jq --arg tag "${TAG}" \
            '.[] | select(.tag_name == $tag and .draft == true)' releases.json > release.json
          expected=(
            "SHA256SUMS"
            "shimpz-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
            "shimpz-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
            "shimpz-${VERSION}-aarch64-unknown-linux-gnu.tar.gz"
            "shimpz-${VERSION}-x86_64-apple-darwin.tar.gz"
            "shimpz-${VERSION}-aarch64-apple-darwin.tar.gz"
            "shimpz-${VERSION}-x86_64-pc-windows-msvc.zip"
          )
          mapfile -t actual < <(jq -r '.assets[].name' release.json | sort)
          mapfile -t required < <(printf '%s\n' "${expected[@]}" | sort)
          if ! diff -u <(printf '%s\n' "${required[@]}") <(printf '%s\n' "${actual[@]}"); then
            echo "::error::the draft release assets differ from the closed target set"
            exit 1
          fi
          mkdir dist
          while IFS=$'\t' read -r asset_id asset_name; do
            gh api -H 'Accept: application/octet-stream' \
              "/repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}" > "dist/${asset_name}"
          done < <(jq -r '.assets[] | [.id, .name] | @tsv' release.json)
          (cd dist && sha256sum --check SHA256SUMS)
          for archive in dist/shimpz-*; do
            gh attestation verify "${archive}" --repo "${GITHUB_REPOSITORY}"
          done

  finalize:
    needs: [metadata, verify-draft]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the verified release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false --latest
          test "$(gh api "/repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name)" = "${TAG}"
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output crate-index \
            "https://index.crates.io/sh/im/shimpz-cli"
          jq --exit-status --arg version "${VERSION}" \
            'select(.vers == $version and .yanked == false)' crate-index > /dev/null
