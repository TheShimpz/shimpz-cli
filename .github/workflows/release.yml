name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.registry.outputs.published }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Verify release version
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "${tag_version}" = "${package_version}"
          echo "version=${package_version}" >> "${GITHUB_OUTPUT}"
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-features --locked --jobs "$(nproc)"
      - run: cargo package --locked
      - name: Check crates.io
        id: registry
        run: |
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --output crate-index \
            "https://index.crates.io/sh/im/shimpz-cli"
          if jq --exit-status --arg version "${{ steps.version.outputs.version }}" \
            'select(.vers == $version)' crate-index > /dev/null
          then
            echo "published=true" >> "${GITHUB_OUTPUT}"
          else
            echo "published=false" >> "${GITHUB_OUTPUT}"
          fi

  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: shimpz
            format: tar
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            executable: shimpz
            format: tar
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            executable: shimpz
            format: tar
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: shimpz
            format: tar
          - runner: macos-latest
            target: aarch64-apple-darwin
            executable: shimpz
            format: tar
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: shimpz.exe
            format: zip
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install musl linker
        if: ${{ contains(matrix.platform.target, 'musl') }}
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.platform.target }}
      - run: cargo build --release --locked --target ${{ matrix.platform.target }}
      - name: Verify binary
        shell: bash
        run: target/${{ matrix.platform.target }}/release/${{ matrix.platform.executable }} --version
      - name: Package binary
        shell: bash
        run: |
          name="shimpz-${{ needs.metadata.outputs.version }}-${{ matrix.platform.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.platform.target }}/release/${{ matrix.platform.executable }}" "dist/${name}/"
          cp LICENSE NOTICE README.md "dist/${name}/"
          if test "${{ matrix.platform.format }}" = "zip"; then
            7z a "dist/${name}.zip" "./dist/${name}/*"
          else
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          fi
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: binary-${{ matrix.platform.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [metadata, build]
    if: needs.metadata.outputs.published != 'true'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Authenticate to crates.io
        id: crates
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
      - name: Publish shimpz-cli
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates.outputs.token }}

  release:
    needs: [metadata, build, publish]
    if: >-
      always() &&
      needs.metadata.result == 'success' &&
      needs.build.result == 'success' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          sha256sum shimpz-* > SHA256SUMS
      - name: Attest every released binary archive
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/shimpz-*
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}" dist/*
          --repo "${GITHUB_REPOSITORY}"
          --verify-tag
          --generate-notes
          --title "Shimpz CLI ${{ needs.metadata.outputs.version }}"
