[package]
name = "shimpz-cli"
version = "0.5.29"
description = "Fast local tooling for Shimpz Assistants"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/TheShimpz/shimpz-cli"
homepage = "https://shimpz.com"
rust-version = "1.97.1"
readme = "README.md"
authors = ["Shimpz Inc"]
keywords = ["assistant", "cli", "shimpz"]
categories = ["command-line-utilities", "development-tools"]
publish = ["crates-io"]
include = ["contracts/**", "src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "NOTICE"]

[dependencies]
anstream = "1.0.0"
anstyle = "1.0.14"
atomic-write-file = "0.3.0"
base64 = "0.22"
crc32fast = "1"
memsafe = "=1.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rpassword = "7.5.4"
sha2 = "0.10"
toml = { version = "1.1.4", default-features = false, features = ["parse", "serde"] }
self_update = { version = "0.44.0", default-features = false, features = ["compression-flate2", "compression-zip-deflate", "rustls", "ureq"] }
ureq = { version = "3.3.0", default-features = false, features = ["json", "rustls"] }
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30.1", default-features = false, features = ["signal"] }
rustix = { version = "1", features = ["fs", "process", "termios"] }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
serde_yaml = "0.9.34"
tempfile = "3"

[[bin]]
name = "shimpz"
path = "src/main.rs"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
